<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo da Cobrinha - Marcelo Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #1e261c 0%, #111610 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #e2e8f0;
    }

    .phone-body {
      background: #273124;
      border: 4px solid #3a4736;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      max-width: 360px;
      width: 95%;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 12px;
      color: #a3e635;
      letter-spacing: 0.5px;
    }

    .game-container {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    }

    canvas {
      background-color: #151d13;
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(21, 29, 19, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #facc15;
      text-align: center;
      padding: 16px;
      border-radius: 16px;
    }

    .action-bar {
      width: 100%;
      margin-top: 16px;
      display: flex;
      justify-content: center;
    }

    .btn-action {
      background: linear-gradient(180deg, #84cc16 0%, #65a30d 100%);
      color: #14532d;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(132, 204, 22, 0.3);
      transition: all 0.15s ease;
    }

    .btn-action:active {
      transform: translateY(2px);
      box-shadow: 0 2px 6px rgba(132, 204, 22, 0.2);
    }

    .controls {
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      gap: 10px;
      margin-top: 16px;
      width: 180px;
      height: 180px;
    }

    .btn {
      background: #33412e;
      color: #bef264;
      border: 1px solid #475840;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e271b;
      touch-action: manipulation;
      transition: transform 0.05s ease, background 0.05s ease;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e271b;
      background: #43543d;
    }

    .btn-up { grid-area: up; }
    .btn-down { grid-area: down; }
    .btn-left { grid-area: left; }
    .btn-right { grid-area: right; }

    .instructions {
      margin-top: 14px;
      font-size: 11px;
      color: #788d71;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="phone-body">
    <div class="header">
      <span>🐍 MARCELO SNAKE</span>
      <span id="score">SCORE: 0</span>
    </div>

    <div class="game-container">
      <canvas id="game" width="300" height="300"></canvas>
      <div id="overlay" class="overlay">PRESSIONE START</div>
    </div>

    <div class="action-bar">
      <button class="btn-action" id="btn-play">▶ START / PAUSE</button>
    </div>

    <div class="controls">
      <button class="btn btn-up" id="btn-up">▲</button>
      <button class="btn btn-left" id="btn-left">◀</button>
      <button class="btn btn-right" id="btn-right">▶</button>
      <button class="btn btn-down" id="btn-down">▼</button>
    </div>

    <div class="instructions">Use os botões, deslize na tela ou use as setas do teclado</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const playBtn = document.getElementById("btn-play");

    const gridSize = 15;
    const tileCount = canvas.width / gridSize;
    const maxSnakeLength = tileCount * tileCount;

    // Velocidade suavizada (160ms por passo)
    const stepInterval = 200; 
    let lastStepTime = 0;
    let progress = 0;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = -1;
    let nextDx = 0;
    let nextDy = -1;
    let score = 0;
    
    let isRunning = false;
    let isGameWon = false;
    let animationFrameId = null;

    function initGame() {
      snake = [
        { x: 10, y: 10, prevX: 10, prevY: 10 },
        { x: 10, y: 11, prevX: 10, prevY: 11 },
        { x: 10, y: 12, prevX: 10, prevY: 12 }
      ];
      dx = 0;
      dy = -1;
      nextDx = 0;
      nextDy = -1;
      score = 0;
      isGameWon = false;
      scoreElement.textContent = `SCORE: ${score}`;
      generateFood();
      renderFrame(0);
    }

    function togglePlayPause() {
      if (!isRunning) {
        if (isGameWon || overlay.textContent === "GAME OVER") {
          initGame();
        }
        isRunning = true;
        overlay.style.display = "none";
        playBtn.textContent = "⏸ PAUSA";
        lastStepTime = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
      } else {
        isRunning = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        overlay.textContent = "PAUSADO";
        overlay.style.display = "flex";
        playBtn.textContent = "▶ CONTINUAR";
      }
    }

    function gameLoop(currentTime) {
      if (!isRunning) return;

      const delta = currentTime - lastStepTime;

      if (delta >= stepInterval) {
        lastStepTime = currentTime - (delta % stepInterval);
        dx = nextDx;
        dy = nextDy;

        if (hasGameEnded()) {
          isRunning = false;
          overlay.textContent = "GAME OVER";
          overlay.style.display = "flex";
          playBtn.textContent = "▶ JOGAR DE NOVO";
          return;
        }

        moveSnake();

        if (isGameWon) {
          isRunning = false;
          overlay.textContent = "🏆 VOCÊ GANHOU!";
          overlay.style.display = "flex";
          playBtn.textContent = "▶ JOGAR DE NOVO";
          return;
        }
      }

      progress = Math.min((currentTime - lastStepTime) / stepInterval, 1);
      renderFrame(progress);

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function moveSnake() {
      snake.forEach(part => {
        part.prevX = part.x;
        part.prevY = part.y;
      });

      const head = { 
        x: snake[0].x + dx, 
        y: snake[0].y + dy,
        prevX: snake[0].x,
        prevY: snake[0].y
      };

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = `SCORE: ${score}`;

        if (snake.length === maxSnakeLength) {
          isGameWon = true;
        } else {
          generateFood();
        }
      } else {
        snake.pop();
      }
    }

    function renderFrame(p) {
      clearCanvas();
      drawGridLines();
      drawFood();
      drawSnake(p);
    }

    function clearCanvas() {
      ctx.fillStyle = "#151d13";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGridLines() {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
    }

    function drawSnake(p) {
      for (let i = snake.length - 1; i >= 0; i--) {
        const part = snake[i];
        
        const interpX = (part.prevX + (part.x - part.prevX) * p) * gridSize;
        const interpY = (part.prevY + (part.y - part.prevY) * p) * gridSize;

        const isHead = i === 0;
        const size = gridSize - 2;
        const radius = isHead ? 6 : 4;

        ctx.fillStyle = isHead ? "#a3e635" : "#65a30d";
        
        ctx.beginPath();
        ctx.roundRect(interpX + 1, interpY + 1, size, size, radius);
        ctx.fill();

        if (isHead) {
          ctx.fillStyle = "#14532d";
          let eye1X, eye1Y, eye2X, eye2Y;
          const eyeSize = 2.5;

          if (dx === 1) {
            eye1X = interpX + size - 3; eye1Y = interpY + 4;
            eye2X = interpX + size - 3; eye2Y = interpY + size - 4;
          } else if (dx === -1) {
            eye1X = interpX + 3; eye1Y = interpY + 4;
            eye2X = interpX + 3; eye2Y = interpY + size - 4;
          } else if (dy === 1) {
            eye1X = interpX + 4; eye1Y = interpY + size - 3;
            eye2X = interpX + size - 4; eye2Y = interpY + size - 3;
          } else {
            eye1X = interpX + 4; eye1Y = interpY + 3;
            eye2X = interpX + size - 4; eye2Y = interpY + 3;
          }

          ctx.beginPath();
          ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
          ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawFood() {
      if (isGameWon) return;
      const x = food.x * gridSize;
      const y = food.y * gridSize;

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(x + gridSize / 2, y + gridSize / 2 + 1, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#84cc16";
      ctx.beginPath();
      ctx.ellipse(x + gridSize / 2 + 2, y + 3, 3, 1.5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function generateFood() {
      let emptyTiles = [];
      for (let x = 0; x < tileCount; x++) {
        for (let y = 0; y < tileCount; y++) {
          const isOccupied = snake.some(part => part.x === x && part.y === y);
          if (!isOccupied) emptyTiles.push({ x, y });
        }
      }

      if (emptyTiles.length === 0) {
        isGameWon = true;
        return;
      }

      const randomIndex = Math.floor(Math.random() * emptyTiles.length);
      food = emptyTiles[randomIndex];
    }

    function hasGameEnded() {
      const nextHeadX = snake[0].x + nextDx;
      const nextHeadY = snake[0].y + nextDy;

      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === nextHeadX && snake[i].y === nextHeadY) return true;
      }

      return nextHeadX < 0 || nextHeadX >= tileCount || nextHeadY < 0 || nextHeadY >= tileCount;
    }

    function changeDirection(direction) {
      if (!isRunning) return;

      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      let changed = false;
      if (direction === 'LEFT' && !goingRight) { nextDx = -1; nextDy = 0; changed = true; }
      if (direction === 'UP' && !goingDown) { nextDx = 0; nextDy = -1; changed = true; }
      if (direction === 'RIGHT' && !goingLeft) { nextDx = 1; nextDy = 0; changed = true; }
      if (direction === 'DOWN' && !goingUp) { nextDx = 0; nextDy = 1; changed = true; }

      if (changed) {
        dx = nextDx;
        dy = nextDy;
      }
    }

    playBtn.addEventListener("click", () => togglePlayPause());

    document.addEventListener("keydown", event => {
      if (event.key === " ") togglePlayPause();
      if (event.key === "ArrowLeft") changeDirection('LEFT');
      if (event.key === "ArrowUp") changeDirection('UP');
      if (event.key === "ArrowRight") changeDirection('RIGHT');
      if (event.key === "ArrowDown") changeDirection('DOWN');
    });

    const bindButton = (id, direction) => {
      const btn = document.getElementById(id);
      
      const handlePress = (e) => {
        e.preventDefault();
        changeDirection(direction);
      };

      btn.addEventListener("touchstart", handlePress, { passive: false });
      btn.addEventListener("pointerdown", handlePress);
    };

    bindButton("btn-up", 'UP');
    bindButton("btn-down", 'DOWN');
    bindButton("btn-left", 'LEFT');
    bindButton("btn-right", 'RIGHT');

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (!isRunning) return;

      let diffX = e.changedTouches[0].clientX - touchStartX;
      let diffY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(diffX) > 15 || Math.abs(diffY) > 15) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
          changeDirection(diffX > 0 ? 'RIGHT' : 'LEFT');
        } else {
          changeDirection(diffY > 0 ? 'DOWN' : 'UP');
        }
      }
    }, { passive: true });

    initGame();
  </script>
</body>
</html>
