<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo da Cobrinha - Nokia 3310</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #000;
    }

    /* Container ajustado para a nova imagem */
    .nokia-container {
      position: relative;
      width: 360px;
      height: 720px;
      background: url('nokia.jpg') no-repeat center center;
      background-size: contain;
      display: flex;
      justify-content: center;
    }

    /* Tela LCD perfeitamente enquadrada no visor preto */
    .lcd-screen {
      position: absolute;
      top: 198px;
      width: 220px;
      height: 165px;
      background-color: #9bbc0f;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: bold;
      color: #0f380f;
      border-bottom: 1px solid #0f380f;
      padding-bottom: 2px;
    }

    canvas {
      background-color: #9bbc0f;
      display: block;
      touch-action: none;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      height: calc(100% - 20px);
      background: rgba(155, 188, 15, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #0f380f;
      text-align: center;
      padding: 6px;
    }

    /* Botão Play invisível sobre o botão principal com traço azul */
    #btn-play {
      position: absolute;
      top: 390px;
      left: 118px;
      width: 124px;
      height: 35px;
      background: transparent;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      border-radius: 18px;
    }

    #btn-play:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* D-PAD Virtual com Botões Estilizados estilo Nokia */
    .dpad-container {
      position: absolute;
      top: 480px;
      width: 160px;
      height: 160px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 5px;
    }

    .dpad-btn {
      background: #c5cbb7;
      border: 2px solid #5a634b;
      border-radius: 12px;
      color: #0f380f;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #414835, inset 0 2px 0 rgba(255, 255, 255, 0.5);
      touch-action: manipulation;
    }

    .dpad-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #414835;
      background: #aab29b;
    }

    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }

  </style>
</head>
<body>

  <div class="nokia-container">
    <!-- Tela do Jogo enquadrada no visor -->
    <div class="lcd-screen">
      <div class="status-bar">
        <span>🐍 MARCELO SNAKE</span>
        <span id="score">SCORE: 0</span>
      </div>

      <canvas id="game" width="200" height="135"></canvas>

      <div id="overlay" class="overlay">
        <span id="overlay-text">TOQUE NO BOTÃO AZUL PARA INICIAR</span>
      </div>
    </div>

    <!-- Botão Invisível para Play/Select -->
    <button id="btn-play"></button>

    <!-- D-Pad Virtual com as 4 setas -->
    <div class="dpad-container">
      <button class="dpad-btn" id="btn-up">▲</button>
      <button class="dpad-btn" id="btn-left">◄</button>
      <button class="dpad-btn" id="btn-right">►</button>
      <button class="dpad-btn" id="btn-down">▼</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const overlayText = document.getElementById("overlay-text");

    const gridSize = 8;
    const tileCountX = Math.floor(canvas.width / gridSize);
    const tileCountY = Math.floor(canvas.height / gridSize);

    const stepInterval = 220; 
    let lastStepTime = 0;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    
    let isRunning = false;
    let animationFrameId = null;

    function initGame() {
      snake = [
        { x: 5, y: 5 },
        { x: 4, y: 5 },
        { x: 3, y: 5 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      scoreElement.textContent = `SCORE: ${score}`;
      generateFood();
      renderFrame();
    }

    function startGame() {
      if (!isRunning) {
        if (overlayText.textContent.includes("GAME OVER") || overlayText.textContent.includes("GANHOU")) {
          initGame();
        }
        isRunning = true;
        overlay.style.display = "none";
        lastStepTime = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function gameLoop(currentTime) {
      if (!isRunning) return;

      const delta = currentTime - lastStepTime;

      if (delta >= stepInterval) {
        lastStepTime = currentTime - (delta % stepInterval);
        dx = nextDx;
        dy = nextDy;

        if (hasGameEnded()) {
          isRunning = false;
          overlayText.textContent = "GAME OVER";
          overlay.style.display = "flex";
          return;
        }

        moveSnake();
      }

      renderFrame();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = `SCORE: ${score}`;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function renderFrame() {
      ctx.fillStyle = "#9bbc0f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0f380f";
      snake.forEach(part => {
        ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });

      ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
    }

    function generateFood() {
      let emptyTiles = [];
      for (let x = 0; x < tileCountX; x++) {
        for (let y = 0; y < tileCountY; y++) {
          if (!snake.some(p => p.x === x && p.y === y)) {
            emptyTiles.push({ x, y });
          }
        }
      }
      if (emptyTiles.length === 0) return;
      food = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
    }

    function hasGameEnded() {
      const headX = snake[0].x + nextDx;
      const headY = snake[0].y + nextDy;

      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === headX && snake[i].y === headY) return true;
      }

      return headX < 0 || headX >= tileCountX || headY < 0 || headY >= tileCountY;
    }

    function changeDirection(direction) {
      if (!isRunning) return;

      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      let changed = false;
      if (direction === 'LEFT' && !goingRight) { nextDx = -1; nextDy = 0; changed = true; }
      if (direction === 'UP' && !goingDown) { nextDx = 0; nextDy = -1; changed = true; }
      if (direction === 'RIGHT' && !goingLeft) { nextDx = 1; nextDy = 0; changed = true; }
      if (direction === 'DOWN' && !goingUp) { nextDx = 0; nextDy = 1; changed = true; }

      if (changed) {
        dx = nextDx;
        dy = nextDy;
      }
    }

    const bindButton = (id, action) => {
      const btn = document.getElementById(id);
      if (!btn) return;

      const handlePress = (e) => {
        e.preventDefault();
        action();
      };

      btn.addEventListener("touchstart", handlePress, { passive: false });
      btn.addEventListener("pointerdown", handlePress);
    };

    bindButton("btn-up", () => changeDirection('UP'));
    bindButton("btn-down", () => changeDirection('DOWN'));
    bindButton("btn-left", () => changeDirection('LEFT'));
    bindButton("btn-right", () => changeDirection('RIGHT'));
    bindButton("btn-play", () => startGame());

    document.addEventListener("keydown", event => {
      if (event.key === " " || event.key === "Enter") startGame();
      if (event.key === "ArrowLeft") changeDirection('LEFT');
      if (event.key === "ArrowUp") changeDirection('UP');
      if (event.key === "ArrowRight") changeDirection('RIGHT');
      if (event.key === "ArrowDown") changeDirection('DOWN');
    });

    initGame();
  </script>
</body>
</html>
