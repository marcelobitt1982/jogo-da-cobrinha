<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo da Cobrinha - Nokia 3310</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #000;
    }

    /* Container da Imagem Real */
    .nokia-container {
      position: relative;
      width: 360px;
      height: 720px;
      background: url('nokia.jpg') no-repeat center center;
      background-size: contain;
      display: flex;
      justify-content: center;
    }

    /* Tela LCD perfeitamente enquadrada */
    .lcd-screen {
      position: absolute;
      top: 202px;
      width: 202px;
      height: 145px;
      background-color: #9bbc0f;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3px;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: bold;
      color: #0f380f;
      border-bottom: 1px solid #0f380f;
      padding-bottom: 1px;
    }

    canvas {
      background-color: #9bbc0f;
      display: block;
      touch-action: none;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      height: calc(100% - 16px);
      background: rgba(155, 188, 15, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #0f380f;
      text-align: center;
      padding: 4px;
    }

    /* Camada de Botões Invisíveis mapeados nos botões do telefone */
    .touch-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0); /* Mude para rgba(255, 0, 0, 0.3) para enxergar a área de toque */
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    .touch-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Botão Central Azul (Start/Select) */
    #btn-play {
      top: 388px;
      left: 118px;
      width: 124px;
      height: 32px;
      border-radius: 18px;
    }

    /* Mapeamento de Direção sobre os botões físicos do Nokia */
    #btn-up    { top: 375px; left: 118px; width: 124px; height: 28px; border-radius: 14px; } /* Parte superior do botão central */
    #btn-down  { top: 435px; left: 190px; width: 80px;  height: 52px; border-radius: 15px; } /* Botão com a seta 'v' */
    #btn-left  { top: 412px; left: 70px;  width: 75px;  height: 52px; border-radius: 15px; } /* Botão com a tecla 'C' */
    #btn-right { top: 410px; left: 235px; width: 65px;  height: 48px; border-radius: 15px; } /* Botão com a seta '>' */

  </style>
</head>
<body>

  <div class="nokia-container">
    <!-- Tela do Jogo -->
    <div class="lcd-screen">
      <div class="status-bar">
        <span>🐍 MARCELO SNAKE</span>
        <span id="score">SCORE: 0</span>
      </div>

      <canvas id="game" width="192" height="120"></canvas>

      <div id="overlay" class="overlay">
        <span id="overlay-text">TOQUE NO BOTÃO AZUL PARA INICIAR</span>
      </div>
    </div>

    <!-- Botões Virtuais Mapeados nos Botões Físicos -->
    <button class="touch-btn" id="btn-play"></button>
    <button class="touch-btn" id="btn-up"></button>
    <button class="touch-btn" id="btn-down"></button>
    <button class="touch-btn" id="btn-left"></button>
    <button class="touch-btn" id="btn-right"></button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const overlayText = document.getElementById("overlay-text");

    const gridSize = 8;
    const tileCountX = Math.floor(canvas.width / gridSize);
    const tileCountY = Math.floor(canvas.height / gridSize);

    const stepInterval = 200; 
    let lastStepTime = 0;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    
    let isRunning = false;
    let animationFrameId = null;

    function initGame() {
      snake = [
        { x: 5, y: 5 },
        { x: 4, y: 5 },
        { x: 3, y: 5 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      scoreElement.textContent = `SCORE: ${score}`;
      generateFood();
      renderFrame();
    }

    function startGame() {
      if (!isRunning) {
        if (overlayText.textContent.includes("GAME OVER") || overlayText.textContent.includes("GANHOU")) {
          initGame();
        }
        isRunning = true;
        overlay.style.display = "none";
        lastStepTime = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function gameLoop(currentTime) {
      if (!isRunning) return;

      const delta = currentTime - lastStepTime;

      if (delta >= stepInterval) {
        lastStepTime = currentTime - (delta % stepInterval);
        
        dx = nextDx;
        dy = nextDy;

        const newHead = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (checkCollision(newHead)) {
          isRunning = false;
          overlayText.textContent = "GAME OVER";
          overlay.style.display = "flex";
          return;
        }

        snake.unshift(newHead);

        if (newHead.x === food.x && newHead.y === food.y) {
          score += 10;
          scoreElement.textContent = `SCORE: ${score}`;
          generateFood();
        } else {
          snake.pop();
        }
      }

      renderFrame();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function checkCollision(head) {
      if (head.x < 0 || head.x >= tileCountX) return true;
      if (head.y < 0 || head.y >= tileCountY) return true;

      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return true;
        }
      }

      return false;
    }

    function renderFrame() {
      ctx.fillStyle = "#9bbc0f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0f380f";
      snake.forEach(part => {
        ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });

      ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
    }

    function generateFood() {
      let emptyTiles = [];
      for (let x = 0; x < tileCountX; x++) {
        for (let y = 0; y < tileCountY; y++) {
          if (!snake.some(p => p.x === x && p.y === y)) {
            emptyTiles.push({ x, y });
          }
        }
      }
      if (emptyTiles.length === 0) return;
      food = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
    }

    function changeDirection(direction) {
      if (!isRunning) return;

      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      if (direction === 'UP' && !goingDown) { nextDx = 0; nextDy = -1; }
      if (direction === 'DOWN' && !goingUp) { nextDx = 0; nextDy = 1; }
      if (direction === 'LEFT' && !goingRight) { nextDx = -1; nextDy = 0; }
      if (direction === 'RIGHT' && !goingLeft) { nextDx = 1; nextDy = 0; }
    }

    const bindButton = (id, action) => {
      const btn = document.getElementById(id);
      if (!btn) return;

      const handlePress = (e) => {
        e.preventDefault();
        action();
      };

      btn.addEventListener("touchstart", handlePress, { passive: false });
      btn.addEventListener("pointerdown", handlePress);
    };

    // Mapeamento dos botões na tela
    bindButton("btn-up", () => changeDirection('UP'));
    bindButton("btn-down", () => changeDirection('DOWN'));
    bindButton("btn-left", () => changeDirection('LEFT'));
    bindButton("btn-right", () => changeDirection('RIGHT'));
    bindButton("btn-play", () => startGame());

    // Suporte para Teclado do PC (incluindo as teclas 2, 8, 4, 6 e 5)
    document.addEventListener("keydown", event => {
      if (event.key === " " || event.key === "Enter") startGame();
      if (event.key === "ArrowUp" || event.key === "2") changeDirection('UP');
      if (event.key === "ArrowDown" || event.key === "8" || event.key === "5") changeDirection('DOWN');
      if (event.key === "ArrowLeft" || event.key === "4") changeDirection('LEFT');
      if (event.key === "ArrowRight" || event.key === "6") changeDirection('RIGHT');
    });

    initGame();
  </script>
</body>
</html>
