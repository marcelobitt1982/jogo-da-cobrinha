<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo da Cobrinha - Nokia 3310</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #000;
    }

    /* Container com a Imagem Real do Nokia */
    .nokia-container {
      position: relative;
      width: 360px;
      height: 720px;
      background: url('nokia.jpg') no-repeat center center;
      background-size: contain;
      display: flex;
      justify-content: center;
    }

    /* Tela do Jogo sobreposta na tela da imagem */
    .lcd-screen {
      position: absolute;
      top: 191px;
      width: 200px;
      height: 153px;
      background-color: #9bbc0f;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: bold;
      color: #0f380f;
      border-bottom: 1px solid #0f380f;
      padding-bottom: 1px;
    }

    canvas {
      background-color: #9bbc0f;
      display: block;
      touch-action: none;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      top: 18px;
      left: 0;
      width: 100%;
      height: calc(100% - 18px);
      background: rgba(155, 188, 15, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #0f380f;
      text-align: center;
      padding: 6px;
    }

    /* Camada de Botões Invisíveis mapeados sobre a imagem */
    .touch-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0); /* Mude para rgba(255,0,0,0.3) se quiser visualizar a posição exata */
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      border-radius: 50%;
    }

    .touch-btn:active {
      background: rgba(255, 255, 255, 0.3); /* Efeito visual ao tocar */
    }

    /* Posicionamento ajustado sobre as teclas do Nokia 3310 */
    #btn-play { top: 368px; left: 128px; width: 104px; height: 42px; border-radius: 20px; }
    
    #btn-2 { top: 468px; left: 150px; width: 60px; height: 38px; }
    #btn-4 { top: 512px; left: 78px;  width: 60px; height: 38px; }
    #btn-6 { top: 512px; left: 222px; width: 60px; height: 38px; }
    #btn-8 { top: 556px; left: 150px; width: 60px; height: 38px; }

  </style>
</head>
<body>

  <div class="nokia-container">
    <!-- Tela do Jogo -->
    <div class="lcd-screen">
      <div class="status-bar">
        <span>🐍 SNAKE</span>
        <span id="score">SCORE: 0</span>
      </div>

      <canvas id="game" width="190" height="125"></canvas>

      <div id="overlay" class="overlay">
        <span id="overlay-text">PRESSIONE SELECT</span>
      </div>
    </div>

    <!-- Botões Invisíveis posicionados sobre a foto do telemóvel -->
    <button class="touch-btn" id="btn-play"></button>
    <button class="touch-btn" id="btn-2"></button>
    <button class="touch-btn" id="btn-4"></button>
    <button class="touch-btn" id="btn-6"></button>
    <button class="touch-btn" id="btn-8"></button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const overlayText = document.getElementById("overlay-text");
    const playBtn = document.getElementById("btn-play");

    const gridSize = 8;
    const tileCountX = Math.floor(canvas.width / gridSize);
    const tileCountY = Math.floor(canvas.height / gridSize);

    const stepInterval = 220; 
    let lastStepTime = 0;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    
    let isRunning = false;
    let animationFrameId = null;

    function initGame() {
      snake = [
        { x: 5, y: 5 },
        { x: 4, y: 5 },
        { x: 3, y: 5 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      scoreElement.textContent = `SCORE: ${score}`;
      generateFood();
      renderFrame();
    }

    function togglePlayPause() {
      if (!isRunning) {
        if (overlayText.textContent.includes("GAME OVER") || overlayText.textContent.includes("GANHOU")) {
          initGame();
        }
        isRunning = true;
        overlay.style.display = "none";
        lastStepTime = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function gameLoop(currentTime) {
      if (!isRunning) return;

      const delta = currentTime - lastStepTime;

      if (delta >= stepInterval) {
        lastStepTime = currentTime - (delta % stepInterval);
        dx = nextDx;
        dy = nextDy;

        if (hasGameEnded()) {
          isRunning = false;
          overlayText.textContent = "GAME OVER";
          overlay.style.display = "flex";
          return;
        }

        moveSnake();
      }

      renderFrame();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = `SCORE: ${score}`;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function renderFrame() {
      ctx.fillStyle = "#9bbc0f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0f380f";
      snake.forEach(part => {
        ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });

      ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
    }

    function generateFood() {
      let emptyTiles = [];
      for (let x = 0; x < tileCountX; x++) {
        for (let y = 0; y < tileCountY; y++) {
          if (!snake.some(p => p.x === x && p.y === y)) {
            emptyTiles.push({ x, y });
          }
        }
      }
      if (emptyTiles.length === 0) return;
      food = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
    }

    function hasGameEnded() {
      const headX = snake[0].x + nextDx;
      const headY = snake[0].y + nextDy;

      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === headX && snake[i].y === headY) return true;
      }

      return headX < 0 || headX >= tileCountX || headY < 0 || headY >= tileCountY;
    }

    function changeDirection(direction) {
      if (!isRunning) return;

      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      let changed = false;
      if (direction === 'LEFT' && !goingRight) { nextDx = -1; nextDy = 0; changed = true; }
      if (direction === 'UP' && !goingDown) { nextDx = 0; nextDy = -1; changed = true; }
      if (direction === 'RIGHT' && !goingLeft) { nextDx = 1; nextDy = 0; changed = true; }
      if (direction === 'DOWN' && !goingUp) { nextDx = 0; nextDy = 1; changed = true; }

      if (changed) {
        dx = nextDx;
        dy = nextDy;
      }
    }

    const bindButton = (id, action) => {
      const btn = document.getElementById(id);
      if (!btn) return;

      const handlePress = (e) => {
        e.preventDefault();
        action();
      };

      btn.addEventListener("touchstart", handlePress, { passive: false });
      btn.addEventListener("pointerdown", handlePress);
    };

    bindButton("btn-2", () => changeDirection('UP'));
    bindButton("btn-8", () => changeDirection('DOWN'));
    bindButton("btn-4", () => changeDirection('LEFT'));
    bindButton("btn-6", () => changeDirection('RIGHT'));
    bindButton("btn-play", () => togglePlayPause());

    document.addEventListener("keydown", event => {
      if (event.key === " " || event.key === "Enter") togglePlayPause();
      if (event.key === "ArrowLeft" || event.key === "4") changeDirection('LEFT');
      if (event.key === "ArrowUp" || event.key === "2") changeDirection('UP');
      if (event.key === "ArrowRight" || event.key === "6") changeDirection('RIGHT');
      if (event.key === "ArrowDown" || event.key === "8") changeDirection('DOWN');
    });

    initGame();
  </script>
</body>
</html>
