<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo da Cobrinha - iPod Classic Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #2c2f36 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }

    /* Corpo do iPod Classic */
    .ipod-body {
      background: linear-gradient(145deg, #ffffff 0%, #e6e6e6 70%, #d9d9d9 100%);
      border: 1px solid #b0b0b0;
      border-radius: 36px;
      padding: 24px 20px 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 0.9),
        inset 0 -2px 6px rgba(0, 0, 0, 0.15);
      max-width: 320px;
      width: 90%;
      position: relative;
    }

    .ipod-body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
    }

    /* Moldura da tela */
    .screen-bezel {
      background: #000;
      border-radius: 12px;
      padding: 10px;
      width: 100%;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8), 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    /* Display do iPod */
    .ipod-screen {
      background: #b5d1cf;
      background: linear-gradient(180deg, #cde3e1 0%, #a8c8c6 100%);
      border: 1px solid #789997;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
      color: #1a2b2a;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 12px;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 1px solid #8eadaa;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .game-container {
      position: relative;
      width: 240px;
      height: 240px;
      border: 1px solid #8baaa7;
      border-radius: 4px;
      overflow: hidden;
      background-color: #bcd8d6;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(188, 216, 214, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #1a2b2a;
      text-align: center;
      padding: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    /* Click Wheel com Zonas Claras */
    .click-wheel {
      margin-top: 24px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f5f5f5 0%, #e0e0e0 100%);
      border: 1px solid #c8c8c8;
      box-shadow: 
        0 8px 16px rgba(0, 0, 0, 0.15),
        inset 0 1px 2px rgba(255, 255, 255, 1);
      position: relative;
      overflow: hidden;
    }

    /* Botões Direcionais */
    .wheel-btn {
      position: absolute;
      background: transparent;
      border: none;
      color: #555555;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s ease, color 0.1s ease;
      touch-action: manipulation;
      z-index: 1;
    }

    .wheel-btn:active, .wheel-btn.pressed {
      background: rgba(0, 0, 0, 0.08);
      color: #000;
    }

    .wheel-btn-up {
      top: 0;
      left: 0;
      width: 100%;
      height: 40%;
      align-items: flex-start;
      padding-top: 12px;
    }

    .wheel-btn-down {
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      align-items: flex-end;
      padding-bottom: 12px;
    }

    .wheel-btn-left {
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      justify-content: flex-start;
      padding-left: 14px;
    }

    .wheel-btn-right {
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      justify-content: flex-end;
      padding-right: 14px;
    }

    /* Botão Central com Z-Index Elevado */
    .center-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff 0%, #dedede 100%);
      border: 1px solid #c4c4c4;
      box-shadow: 
        0 2px 5px rgba(0, 0, 0, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      cursor: pointer;
      outline: none;
      z-index: 20;
      touch-action: manipulation;
      transition: transform 0.05s ease, background 0.05s ease;
    }

    .center-button:active, .center-button.pressed {
      transform: translate(-50%, -50%) scale(0.93);
      background: #d4d4d4;
    }

    .instructions {
      margin-top: 16px;
      font-size: 10px;
      color: #888;
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="ipod-body">
    <div class="screen-bezel">
      <div class="ipod-screen">
        <div class="header">
          <span>MARCELO SNAKE</span>
          <span id="score">SCORE: 0</span>
        </div>

        <div class="game-container">
          <canvas id="game" width="240" height="240"></canvas>
          <div id="overlay" class="overlay">CLIQUE NO BOTÃO CENTRAL<br>PARA JOGAR</div>
        </div>
      </div>
    </div>

    <!-- Click Wheel com Botão Central Isolado -->
    <div class="click-wheel">
      <button class="wheel-btn wheel-btn-up" id="btn-up" aria-label="Cima">▲</button>
      <button class="wheel-btn wheel-btn-down" id="btn-down" aria-label="Baixo">▼</button>
      <button class="wheel-btn wheel-btn-left" id="btn-left" aria-label="Esquerda">◄</button>
      <button class="wheel-btn wheel-btn-right" id="btn-right" aria-label="Direita">►</button>
      
      <button class="center-button" id="btn-center" aria-label="Start/Pause"></button>
    </div>

    <div class="instructions">Jogue sem moderação.</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const centerBtn = document.getElementById("btn-center");

    const gridSize = 12;
    const tileCount = canvas.width / gridSize;
    const maxSnakeLength = tileCount * tileCount;

    const stepInterval = 150; 
    let lastStepTime = 0;
    let progress = 0;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = -1;
    let nextDx = 0;
    let nextDy = -1;
    let score = 0;

    let isRunning = false;
    let isGameWon = false;
    let animationFrameId = null;

    function initGame() {
      snake = [
        { x: 10, y: 10, prevX: 10, prevY: 10 },
        { x: 10, y: 11, prevX: 10, prevY: 11 },
        { x: 10, y: 12, prevX: 10, prevY: 12 }
      ];
      dx = 0;
      dy = -1;
      nextDx = 0;
      nextDy = -1;
      score = 0;
      isGameWon = false;
      scoreElement.textContent = `SCORE: ${score}`;
      generateFood();
      renderFrame(0);
    }

    function togglePlayPause() {
      if (!isRunning) {
        if (isGameWon || overlay.textContent.includes("GAME OVER")) {
          initGame();
        }
        isRunning = true;
        overlay.style.display = "none";
        lastStepTime = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
      } else {
        isRunning = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        overlay.innerHTML = "PAUSADO<br><span style='font-size:10px; font-weight:normal;'>Clique no centro para continuar</span>";
        overlay.style.display = "flex";
      }
    }

    function gameLoop(currentTime) {
      if (!isRunning) return;

      const delta = currentTime - lastStepTime;

      if (delta >= stepInterval) {
        lastStepTime = currentTime - (delta % stepInterval);

        dx = nextDx;
        dy = nextDy;

        if (hasGameEnded()) {
          isRunning = false;
          overlay.innerHTML = "GAME OVER<br><span style='font-size:10px; font-weight:normal;'>Clique no centro para reiniciar</span>";
          overlay.style.display = "flex";
          return;
        }

        moveSnake();

        if (isGameWon) {
          isRunning = false;
          overlay.innerHTML = "🏆 VOCÊ GANHOU!<br><span style='font-size:10px; font-weight:normal;'>Clique no centro para reiniciar</span>";
          overlay.style.display = "flex";
          return;
        }
      }

      progress = Math.min((currentTime - lastStepTime) / stepInterval, 1);
      renderFrame(progress);

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function moveSnake() {
      snake.forEach(part => {
        part.prevX = part.x;
        part.prevY = part.y;
      });

      const head = { 
        x: snake[0].x + dx, 
        y: snake[0].y + dy,
        prevX: snake[0].x,
        prevY: snake[0].y
      };

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = `SCORE: ${score}`;

        if (snake.length === maxSnakeLength) {
          isGameWon = true;
        } else {
          generateFood();
        }
      } else {
        snake.pop();
      }
    }

    function renderFrame(p) {
      clearCanvas();
      drawGridLines();
      drawFood();
      drawSnake(p);
    }

    function clearCanvas() {
      ctx.fillStyle = "#bcd8d6";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGridLines() {
      ctx.strokeStyle = "rgba(0, 0, 0, 0.04)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
    }

    function drawSnake(p) {
      for (let i = snake.length - 1; i >= 0; i--) {
        const part = snake[i];
        
        const interpX = (part.prevX + (part.x - part.prevX) * p) * gridSize;
        const interpY = (part.prevY + (part.y - part.prevY) * p) * gridSize;

        const isHead = i === 0;
        const size = gridSize - 1;
        const radius = isHead ? 3 : 2;

        ctx.fillStyle = isHead ? "#0f1d1b" : "#2d4441";
        
        ctx.beginPath();
        ctx.roundRect(interpX, interpY, size, size, radius);
        ctx.fill();

        if (isHead) {
          ctx.fillStyle = "#bcd8d6";
          let eye1X, eye1Y, eye2X, eye2Y;
          const eyeSize = 1.5;

          if (dx === 1) {
            eye1X = interpX + size - 2; eye1Y = interpY + 3;
            eye2X = interpX + size - 2; eye2Y = interpY + size - 3;
          } else if (dx === -1) {
            eye1X = interpX + 2; eye1Y = interpY + 3;
            eye2X = interpX + 2; eye2Y = interpY + size - 3;
          } else if (dy === 1) {
            eye1X = interpX + 3; eye1Y = interpY + size - 2;
            eye2X = interpX + size - 3; eye2Y = interpY + size - 2;
          } else {
            eye1X = interpX + 3; eye1Y = interpY + 2;
            eye2X = interpX + size - 3; eye2Y = interpY + 2;
          }

          ctx.beginPath();
          ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
          ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawFood() {
      if (isGameWon) return;
      const x = food.x * gridSize;
      const y = food.y * gridSize;

      ctx.fillStyle = "#112220";
      ctx.beginPath();
      ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 2 - 1, 0, Math.PI * 2);
      ctx.fill();
    }

    function generateFood() {
      let emptyTiles = [];
      for (let x = 0; x < tileCount; x++) {
        for (let y = 0; y < tileCount; y++) {
          const isOccupied = snake.some(part => part.x === x && part.y === y);
          if (!isOccupied) emptyTiles.push({ x, y });
        }
      }

      if (emptyTiles.length === 0) {
        isGameWon = true;
        return;
      }

      const randomIndex = Math.floor(Math.random() * emptyTiles.length);
      food = emptyTiles[randomIndex];
    }

    function hasGameEnded() {
      const nextHeadX = snake[0].x + nextDx;
      const nextHeadY = snake[0].y + nextDy;

      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === nextHeadX && snake[i].y === nextHeadY) return true;
      }

      return nextHeadX < 0 || nextHeadX >= tileCount || nextHeadY < 0 || nextHeadY >= tileCount;
    }

    function changeDirection(direction) {
      if (!isRunning) return;

      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      if (direction === 'LEFT' && !goingRight) { nextDx = -1; nextDy = 0; }
      if (direction === 'UP' && !goingDown) { nextDx = 0; nextDy = -1; }
      if (direction === 'RIGHT' && !goingLeft) { nextDx = 1; nextDy = 0; }
      if (direction === 'DOWN' && !goingUp) { nextDx = 0; nextDy = 1; }
    }

    /* Evento do Botão Central Otimizado para Touch e Mouse */
    const handleCenterPress = (e) => {
      e.preventDefault();
      togglePlayPause();
      centerBtn.classList.add('pressed');
      setTimeout(() => centerBtn.classList.remove('pressed'), 120);
    };

    centerBtn.addEventListener("pointerdown", handleCenterPress);
    overlay.addEventListener("click", () => togglePlayPause());

    document.addEventListener("keydown", event => {
      if (event.key === " " || event.key === "Enter") togglePlayPause();
      if (event.key === "ArrowLeft") changeDirection('LEFT');
      if (event.key === "ArrowUp") changeDirection('UP');
      if (event.key === "ArrowRight") changeDirection('RIGHT');
      if (event.key === "ArrowDown") changeDirection('DOWN');
    });

    const bindButton = (id, direction) => {
      const btn = document.getElementById(id);

      const handlePress = (e) => {
        e.preventDefault();
        changeDirection(direction);
        btn.classList.add('pressed');
        setTimeout(() => btn.classList.remove('pressed'), 100);
      };

      btn.addEventListener("pointerdown", handlePress);
    };

    bindButton("btn-up", 'UP');
    bindButton("btn-down", 'DOWN');
    bindButton("btn-left", 'LEFT');
    bindButton("btn-right", 'RIGHT');

    initGame();
  </script>
</body>
</html>
