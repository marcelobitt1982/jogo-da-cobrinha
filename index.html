<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo da Cobrinha</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #2b302a;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #111;
    }

    /* Moldura estilo Nokia */
    .phone-body {
      background-color: #929d89;
      border: 12px solid #5a6353;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 360px;
      width: 95%;
    }

    /* Placar estilo tela monocromática */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 8px;
      color: #1a2312;
      border-bottom: 2px solid #1a2312;
      padding-bottom: 4px;
    }

    /* Áreas do jogo */
    .game-container {
      position: relative;
      width: 300px;
      height: 300px;
    }

    canvas {
      background-color: #a7b39b;
      border: 3px solid #1a2312;
      display: block;
      image-rendering: pixelated;
    }

    /* Mensagem de Pausa / Início na tela */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(167, 179, 155, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #1a2312;
      border: 3px solid #1a2312;
    }

    /* Controles para Celular */
    .action-bar {
      width: 100%;
      margin-top: 12px;
      display: flex;
      justify-content: center;
    }

    .btn-action {
      background-color: #1a2312;
      color: #a7b39b;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #000;
    }

    .btn-action:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #000;
    }

    .controls {
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      gap: 8px;
      margin-top: 12px;
      width: 180px;
      height: 180px;
    }

    .btn {
      background-color: #3b4237;
      color: #a7b39b;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #1f231d;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1f231d;
    }

    .btn-up { grid-area: up; }
    .btn-down { grid-area: down; }
    .btn-left { grid-area: left; }
    .btn-right { grid-area: right; }

    .instructions {
      margin-top: 12px;
      font-size: 11px;
      color: #1a2312;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="phone-body">
    <div class="header">
      <span>MARCELO SNAKE</span>
      <span id="score">SCORE: 0</span>
    </div>

    <div class="game-container">
      <canvas id="game" width="300" height="300"></canvas>
      <div id="overlay" class="overlay">PRESSIONE PLAY</div>
    </div>

    <div class="action-bar">
      <button class="btn-action" id="btn-play">▶ START / PAUSE</button>
    </div>

    <div class="controls">
      <button class="btn btn-up" id="btn-up">▲</button>
      <button class="btn btn-left" id="btn-left">◀</button>
      <button class="btn btn-right" id="btn-right">▶</button>
      <button class="btn btn-down" id="btn-down">▼</button>
    </div>

    <div class="instructions">Use os botões, espaço para pausar ou setas do teclado</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const playBtn = document.getElementById("btn-play");

    const gridSize = 15;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = -1;
    let score = 0;
    let speed = 120;
    
    // Controle de estado
    let isRunning = false;
    let gameTimeout = null;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 }
      ];
      dx = 0;
      dy = -1;
      score = 0;
      scoreElement.textContent = `SCORE: ${score}`;
      generateFood();
      renderStaticFrame();
    }

    // Alterna entre Rodar e Pausar
    function togglePlayPause() {
      if (!isRunning) {
        isRunning = true;
        overlay.style.display = "none";
        playBtn.textContent = "⏸ PAUSA";
        gameLoop();
      } else {
        isRunning = false;
        clearTimeout(gameTimeout);
        overlay.textContent = "PAUSADO";
        overlay.style.display = "flex";
        playBtn.textContent = "▶ CONTINUAR";
      }
    }

    // Loop do Jogo
    function gameLoop() {
      if (!isRunning) return;

      if (hasGameEnded()) {
        isRunning = false;
        overlay.textContent = "GAME OVER";
        overlay.style.display = "flex";
        playBtn.textContent = "▶ JOGAR DE NOVO";
        return;
      }

      gameTimeout = setTimeout(function onTick() {
        clearCanvas();
        drawFood();
        moveSnake();
        drawSnake();
        gameLoop();
      }, speed);
    }

    // Desenha o estado atual sem rodar a animação contínua
    function renderStaticFrame() {
      clearCanvas();
      drawFood();
      drawSnake();
    }

    function clearCanvas() {
      ctx.fillStyle = "#a7b39b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      ctx.fillStyle = "#1a2312";
      snake.forEach(part => {
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1);
      });
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      if (snake[0].x === food.x && snake[0].y === food.y) {
        score += 10;
        scoreElement.textContent = `SCORE: ${score}`;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);

      snake.forEach(part => {
        if (part.x === food.x && part.y === food.y) {
          generateFood();
        }
      });
    }

    function drawFood() {
      ctx.fillStyle = "#1a2312";
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);
    }

    function hasGameEnded() {
      for (let i = 4; i < snake.length; i++) {
        if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
      }

      const hitLeftWall = snake[0].x < 0;
      const hitRightWall = snake[0].x >= tileCount;
      const hitToptWall = snake[0].y < 0;
      const hitBottomWall = snake[0].y >= tileCount;

      return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
    }

    function changeDirection(direction) {
      if (!isRunning) return; // Só muda direção se o jogo estiver rodando

      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      if (direction === 'LEFT' && !goingRight) { dx = -1; dy = 0; }
      if (direction === 'UP' && !goingDown) { dx = 0; dy = -1; }
      if (direction === 'RIGHT' && !goingLeft) { dx = 1; dy = 0; }
      if (direction === 'DOWN' && !goingUp) { dx = 0; dy = 1; }
    }

    // Clique no botão de Play/Pausa
    playBtn.addEventListener("click", () => {
      if (overlay.textContent === "GAME OVER") {
        initGame();
      }
      togglePlayPause();
    });

    // Eventos do Teclado
    document.addEventListener("keydown", event => {
      const keyPressed = event.key;

      if (keyPressed === " ") { // Barra de espaço para pausar/iniciar
        if (overlay.textContent === "GAME OVER") {
          initGame();
        }
        togglePlayPause();
      }

      if (keyPressed === "ArrowLeft") changeDirection('LEFT');
      if (keyPressed === "ArrowUp") changeDirection('UP');
      if (keyPressed === "ArrowRight") changeDirection('RIGHT');
      if (keyPressed === "ArrowDown") changeDirection('DOWN');
    });

    // Eventos dos botões de direção
    document.getElementById("btn-up").addEventListener("click", () => changeDirection('UP'));
    document.getElementById("btn-down").addEventListener("click", () => changeDirection('DOWN'));
    document.getElementById("btn-left").addEventListener("click", () => changeDirection('LEFT'));
    document.getElementById("btn-right").addEventListener("click", () => changeDirection('RIGHT'));

    // Inicializa o estado visual
    initGame();
  </script>
</body>
</html>
