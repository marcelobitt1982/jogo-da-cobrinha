<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARCELO CHESS</title>
    <!-- CSS do Chessground -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessground/9.0.0/chessground.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --button-hover: #0ea5e9;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            perspective: 1200px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
        }

        /* Container 3D para o tabuleiro */
        #board-container {
            position: relative;
            transform-style: preserve-3d;
            margin-bottom: 25px;
            filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.95));
        }

        #board {
            width: 380px;
            height: 380px;
            max-width: 90vw;
            max-height: 90vw;
            border-radius: 14px;
            overflow: hidden;
            border: 3px solid #1e293b;
            transform: rotateX(15deg) scaleY(1.05);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.8);
            background-color: #1e293b;
        }

        /* Cores das casas do tabuleiro */
        .cg-board {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='50' height='50' fill='%23e2e8f0'/><rect x='50' width='50' height='50' fill='%23334155'/><rect y='50' width='50' height='50' fill='%23334155'/><rect x='50' y='50' width='50' height='50' fill='%23e2e8f0'/></svg>");
            background-size: 100px 100px;
        }

        .info {
            background: var(--card-bg);
            padding: 18px 22px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.9);
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status {
            font-size: 15px;
            font-weight: 500;
            margin: 0 0 12px 0;
            color: #cbd5e1;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        select {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            cursor: pointer;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 11px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            flex: 1;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Marcelo Chess</h1>
    
    <!-- Tabuleiro -->
    <div id="board-container">
        <div id="board"></div>
    </div>

    <!-- Controles -->
    <div class="info">
        <p id="status">Carregando jogo...</p>
        <div class="controls-row">
            <select id="colorSelect">
                <option value="white">Jogar de Brancas</option>
                <option value="black">Jogar de Pretas</option>
            </select>
            <button id="resetBtn">Nova Partida</button>
        </div>
    </div>

    <!-- Chess.js para regras -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Chessground para interface visual -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessground/9.0.0/chessground.min.js"></script>

    <script>
        var game = null;
        var chessgroundBoard = null;
        var statusEl = document.getElementById('status');
        var playerColor = 'white';

        function getValidMoves() {
            var dests = new Map();
            var squares = ['a','b','c','d','e','f','g','h'];
            for (var i = 1; i <= 8; i++) {
                squares.forEach(function(s) {
                    var sq = s + i;
                    var moves = game.moves({ square: sq, verbose: true });
                    if (moves.length) {
                        dests.set(sq, moves.map(m => m.to));
                    }
                });
            }
            return dests;
        }

        function updateBoard() {
            var turnColor = game.turn() === 'w' ? 'white' : 'black';
            var isMyTurn = (playerColor === 'white' && turnColor === 'white') || (playerColor === 'black' && turnColor === 'black');

            chessgroundBoard.set({
                fen: game.fen(),
                turnColor: turnColor,
                movable: {
                    color: isMyTurn ? turnColor : undefined,
                    dests: isMyTurn ? getValidMoves() : new Map(),
                    events: {
                        after: function(orig, dest) {
                            var move = game.move({
                                from: orig,
                                to: dest,
                                promotion: 'q'
                            });

                            if (move === null) {
                                chessgroundBoard.set({ fen: game.fen() });
                                return;
                            }

                            updateStatus();

                            if (!game.game_over() && !isMyTurn) {
                                statusEl.innerText = 'Robô pensando...';
                                setTimeout(makeSmartMove, 400);
                            }
                        }
                    }
                }
            });
        }

        function makeSmartMove() {
            var possibleMoves = game.moves({ verbose: true });
            if (possibleMoves.length === 0 || game.game_over()) return;

            var captures = possibleMoves.filter(m => m.captured);
            var chosenMove;
            if (captures.length > 0 && Math.random() < 0.85) {
                chosenMove = captures[Math.floor(Math.random() * captures.length)];
            } else {
                chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }

            game.move(chosenMove);
            updateBoard();
            updateStatus();
        }

        function updateStatus() {
            var turnColorName = game.turn() === 'w' ? 'Brancas' : 'Pretas';
            var isMyTurn = (playerColor === 'white' && game.turn() === 'w') || (playerColor === 'black' && game.turn() === 'b');

            if (game.in_checkmate()) {
                statusEl.innerText = 'Fim de jogo! Xeque-mate. ' + (game.turn() === 'w' ? 'Pretas' : 'Brancas') + ' venceram!';
            } else if (game.in_draw()) {
                statusEl.innerText = 'Fim de jogo! Empate.';
            } else {
                if (isMyTurn) {
                    statusEl.innerText = 'Sua vez (' + (playerColor === 'white' ? 'Brancas' : 'Pretas') + ')';
                } else {
                    statusEl.innerText = 'Vez do Robô...';
                }

                if (game.in_check()) {
                    statusEl.innerText += ' — ' + turnColorName + ' em XEQUE!';
                }
            }
        }

        // Garante que o jogo só inicia após carregar todos os scripts
        window.addEventListener('load', function() {
            if (typeof Chess === 'undefined' || typeof Chessground === 'undefined') {
                statusEl.innerText = 'Erro ao carregar bibliotecas. Verifique sua internet.';
                return;
            }

            game = new Chess();
            chessgroundBoard = Chessground(document.getElementById('board'), {
                fen: game.fen(),
                orientation: 'white',
                movable: {
                    free: false,
                    color: 'white',
                    dests: getValidMoves()
                }
            });
            updateBoard();
            updateStatus();
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            if (!game) return;
            playerColor = document.getElementById('colorSelect').value;
            game.reset();
            
            chessgroundBoard.set({
                orientation: playerColor
            });

            updateBoard();
            updateStatus();

            if (playerColor === 'black') {
                statusEl.innerText = 'Robô pensando...';
                setTimeout(makeSmartMove, 400);
            }
        });
    </script>
</body>
</html>
